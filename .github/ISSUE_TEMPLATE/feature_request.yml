name: 功能建议
description: 提出对 iPhone/iPad 有实际价值的功能。不要粘贴凭据。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 请不要粘贴 Cookie、token URL、原始 HTML 或本地路径。
  - type: checkboxes
    id: privacy
    attributes:
      label: 脱敏确认
      options:
        - label: 我没有在建议中包含凭据或私密链接。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
