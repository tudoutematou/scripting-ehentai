name: 报告 Bug
description: 报告可复现的功能问题。不要粘贴 Cookie 或 token URL。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请不要粘贴 Cookie、账号信息、完整私密链接、带 token 的 URL、原始 HTML、图片内容或本地文件路径。
  - type: checkboxes
    id: privacy
    attributes:
      label: 脱敏确认
      options:
        - label: 我没有在正文、截图或日志中包含 Cookie、token URL、原始 HTML 或本地路径。
          required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 用脱敏后的步骤描述。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 设备
      description: 例如 v1.1.0 · iPadOS 26 · Scripting
    validations:
      required: true
