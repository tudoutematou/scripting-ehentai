name: Navigation audit snapshot
on:
  push:
    branches: [fix/navigation-state-ownership]
    paths: [.github/workflows/navigation-audit-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 86ba36b3f642d934b85503a2f8d0f639b9ce8789
          persist-credentials: false
      - name: Export only committed source at the audit baseline
        run: |
          mkdir -p audit-export
          git archive --format=tar --output=audit-export/source.tar HEAD
          git rev-parse HEAD > audit-export/BASELINE.txt
          sha256sum audit-export/source.tar > audit-export/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: navigation-audit-source
          path: audit-export/
          retention-days: 1
          if-no-files-found: error
